[package]
name = "kernel"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "kernel"
path = "src/main.rs"

[profile.dev]
panic = "abort"
opt-level = 2
debug = true

[profile.release]
panic = "abort"
opt-level = "s"
lto = true

[dependencies]
# Existing dependencies
luna-core = { version = "3", default-features = false, features = ["no-std"] }

# Optional: If you need alloc (Vec, String, etc.) for Lua
# alloc = { version = "0.1", default-features = false, features = ["no-std"] }

# For error handling
thiserror = { version = "1.0", default-features = false }

# For memory management (if you need HashMap/Vector from alloc)
# hashbrown = { version = "0.14", default-features = false }